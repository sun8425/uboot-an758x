name: Build minimal U-Boot + FIP AN7581
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install toolchain & deps
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git make device-tree-compiler libssl-dev

      - name: Clone uboot-an758x
        run: |
          git clone https://github.com/pbs05/uboot-an758x.git uboot
          cd uboot
          git checkout main
          echo "=== listing configs root ==="
          ls -1 configs/
          echo "=== listing arch/arm64/configs ==="
          ls -1 arch/arm64/configs/

      - name: Configure U-Boot with correct defconfig
        run: |
          cd uboot
          make an7581_evb_defconfig
          echo "=== .config exists ==="
          ls -la .config

      - name: Patch U-Boot config, minimal cut
        run: |
          cd uboot
          sed -i 's/^CONFIG_CMD_MMC=y$/# CONFIG_CMD_MMC is not set/' .config
          sed -i 's/^CONFIG_CMD_UBI=y$/# CONFIG_CMD_UBI is not set/' .config
          sed -i 's/^CONFIG_CMD_ETH=y$/# CONFIG_CMD_ETH is not set/' .config
          sed -i 's/^CONFIG_CMD_PON=y$/# CONFIG_CMD_PON is not set/' .config
          sed -i 's/^CONFIG_USB=y$/# CONFIG_USB is not set/' .config
          sed -i 's/^CONFIG_NET=y$/# CONFIG_NET is not set/' .config
          sed -i 's/^CONFIG_DM_ETH=y$/# CONFIG_DM_ETH is not set/' .config
          sed -i 's/^CONFIG_EMMC=y$/# CONFIG_EMMC is not set/' .config
          sed -i 's/^CONFIG_SPI=y$/# CONFIG_SPI is not set/' .config
          sed -i 's/^CONFIG_BOOTCOUNT=y$/# CONFIG_BOOTCOUNT is not set/' .config
          sed -i 's/^CONFIG_ENV=y$/# CONFIG_ENV is not set/' .config
          sed -i 's/^CONFIG_ENV_IS_IN_MMC=y$/# CONFIG_ENV_IS_IN_MMC is not set/' .config
          sed -i 's/^CONFIG_LOG=y$/# CONFIG_LOG is not set/' .config
          sed -i 's/^CONFIG_OF_LIB=y$/# CONFIG_OF_LIB is not set/' .config
          echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> .config

      - name: Build minimal U-Boot
        run: |
          cd uboot
          CROSS_COMPILE=aarch64-linux-gnu- make -j$(nproc)
          ls -lh u-boot.bin

      - name: Clone ATF for BL31 + fiptool
        run: |
          git clone https://github.com/Ansuel/atf-airoha.git atf
          cd atf
          CROSS_COMPILE=aarch64-linux-gnu- make PLAT=an7581 ENABLE_RME=0 bl31
          ls -lh build/an7581/release/bl31.bin

      - name: Build fiptool
        run: |
          cd atf/tools/fiptool
          make
          ls -lh fiptool

      - name: Package FIP (BL31 + u-boot.bin)
        run: |
          cp atf/build/an7581/release/bl31.bin .
          cp uboot/u-boot.bin .
          ./atf/tools/fiptool/fiptool create --bl31 bl31.bin --bl33 u-boot.bin fip.bin
          ls -lh fip.bin

      - name: Upload fip.bin
        uses: actions/upload-artifact@v4
        with:
          name: minimal-fip
          path: fip.bin
